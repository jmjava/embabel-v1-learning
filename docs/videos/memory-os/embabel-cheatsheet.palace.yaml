  - id: compass-rotunda
    seq: 2
    location: Compass Rotunda
    concept: Replan After Every Action
    visual: In a narrow cobalt-tiled corridor, a magnificent pipe-creature slithers, its body
      adorned with glimmering type-tubes while a colossal spinning OODA compass serves as
      its eye, glowing with each observation. The room is illuminated by a sweeping lighthouse
      beam, casting shadows on living moss that carpets the ground, emphasizing the creature's
      transformation as it grows a steel stamp-hand and a luminous quill-hand, ready to replan
      after every action it takes.
    visual_enriched: true
    narration: "Welcome to the Compass Rotunda, where we find ourselves at the seeing-slot\
      \ of our Pipe-Creature. This is a pipe-creature whose body is labeled type-tubes, but\
      \ now it has transformed. It has grown a spinning OODA compass for an eye, making it\
      \ the embodiment of our concept: the ability to replan after every action. \n\nThis\
      \ OODA compass glows and spins, guiding the creature's actions as it navigates through\
      \ its environment. After every action, Embabel reassesses the world around it. Plans\
      \ are not fixed scripts; new objects, null conditions, or flipped circumstances alter\
      \ the next step. This process operates through the OODA loop: Observe, Orient, Decide,\
      \ Act.\n\nRemember, we just came from the Pipe Hall, where types were understood as\
      \ the wiring. Now, with our Pipe-Creature's compass eye, we grasp the importance of\
      \ constant reassessment. \n\nWhat does the spinning compass represent?"
    narration_enriched: true
    overlay: REPLAN
    recall_cue: Spinning compass → replan.
    review_question: What happens after every action?
    review_answer: Replan — OODA / REPLAN
    metaphor_part: seeing-slot
    hero_now: The same creature with a spinning OODA compass for an eye.
    hero_from: A pipe-creature whose body is labeled type-tubes.
    hero_becomes: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_silhouette: A pipe-creature with a compass eye, now adorned with a steel stamp and
      glowing quill.
    hero_shot: A wide shot of the creature standing in front of the spinning OODA compass.
    hero_tell: The compass eye glows and spins, guiding the creature's actions.
