      Welcome to the Glass Skull, located in the seeing-slot of our Embabel Type-Foundry. Here, we find a translucent skull with intricate patterns, which has grown from the previous hero, the glowing bronze type-ingot wearing the System and User envelopes. This glass skull symbolizes the concept of thinking traces.

