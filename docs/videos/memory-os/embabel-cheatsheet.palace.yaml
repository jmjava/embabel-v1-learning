memoryos: 1
palace:
  id: embabel-cheatsheet
  title: Embabel Cheat Sheet Memory Palace
  purpose: Generate a guided study video that teaches Embabel from the learning-repo cheat
    sheet — planner rules first, then PromptRunner APIs — as a two-floor memory palace.
  audience: JVM engineers who know Spring and want Embabel 1.0 plus 1.5 extras as recallable
    rooms, not a slide deck and not a cookbook travel plot.
  learning_method: Method of loci / memory palace. Every locus must have one dominant concept,
    one exaggerated visual mnemonic, and one concise technical explanation.
  style:
    visual: First-person cinematic walkthrough of one living type-foundry. The narrator physically
      moves from locus to locus. Technical labels appear briefly as clean overlays. Visuals
      should be exaggerated, memorable, and slightly absurd without becoming distracting.
      Every locus is the next metamorphosis of the same hero — never a reused generic hallway
      and never a new disconnected prop.
    narration: Calm technical instructor. Explain the mnemonic first, then connect it to the
      Embabel rule. Pause briefly between loci to encourage active recall.
  metaphor:
    name: Embabel Type-Foundry
    throughline: The palace is one living type-foundry. We enter as raw input and the building
      grows pipes, organs, and stamps as Embabel plans, then opens a mouth that speaks typed
      objects.
    material: metal and glass
    hero: a glowing bronze type-ingot that sprouts typed pipes and a compass eye
    hero_origin: A sealed unlabeled bronze seed held in the foundry gate, stamped only UserInput.
    progression: head-slot → seeing-slot → hearing-slot → scent-slot → passage-slot → vault-slot
      → works-slot → grasp-slot → stand-slot → exit-slot
    camera: first-person, inside the creature
    hero_scale: medium-sized in frame
    planned: true
floors:
- id: floor-1
  number: 1
  title: 1.0 Mental Model
  objective: 'Remember the rules that stay true on Embabel 1.0 and 1.5: types are the wiring,
    the process replans after every action, tools attach per call, and planner choice is a
    product decision.'
  recall_route: Types → Replan → Code+LLM → Per-call tools → Named bindings → Planner hats
  metaphor:
    region: The Foundry
    role: 1.0 Mental Model
    hero_stage: Pipe Creature with Compass Eye
    entry: The seed opens into a pipe-creature
    exit: Pipe Hall [Types Are The Wiring] → Compass Rotunda [Replan After Every Action] →
      Split Workbench [Mix Code And LLM] → Bolted Toolbox [Tools Attach Per Call] → Named
      Crates [Bindings Beat Latest Wins] → Hat Rack [Planner Choice]
  loci:
  - id: pipe-hall
    seq: 1
    location: Pipe Hall
    concept: Types Are The Wiring
    visual: Giant empty glass pipes snake through the hall. The bronze seed splits and becomes
      a pipe-creature whose body is those tubes. Source-order stepping stones are absent.
      No lettering.
    narration: "Welcome to the Pipe Hall, located in the head-slot of our Pipe Creature with\
      \ a Compass Eye. This creature has transformed from a sealed unlabeled bronze seed into\
      \ a pipe-creature, its body now comprised of labeled type-tubes. The silhouette we see\
      \ is that of a pipe-creature topped with a large, intricate gear. The gear's teeth are\
      \ inscribed with symbols for turning ideas into action, emphasizing that types are the\
      \ wiring of our system.\n\nThis concept matters because it highlights that actions do\
      \ not run in source order; rather, they follow the structure defined by types. Understanding\
      \ this helps in designing domain objects, which are crucial for controlling the flow\
      \ of processes. \n\nAs we reflect on our previous form, we see the evolution from the\
      \ bronze seed to this pipe-creature, illustrating the transformation of user input into\
      \ structured actions. \n\nNow, think about this: How do glass pipes relate to the concept\
      \ of types?"
    narration_enriched: true
    overlay: '@Action types'
    recall_cue: Glass pipes → types are the wiring.
    review_question: What do return types do in GOAP?
    review_answer: Types are the wiring — @Action types
    key_distinction: Source order is not execution order.
    metaphor_part: head-slot
    hero_now: A pipe-creature whose body is labeled type-tubes.
    hero_from: A sealed unlabeled bronze seed held in the foundry gate, stamped only UserInput.
    hero_becomes: A pipe-creature with an oversized glowing gear for a head.
    hero_silhouette: The outline of a pipe-creature topped with a large, intricate gear.
    hero_shot: Photographed from below, capturing the gear head's glow and complexity.
    hero_tell: The gear's teeth are inscribed with symbols for turning ideas into action.
  - id: compass-rotunda
    seq: 2
    location: Compass Rotunda
    concept: Replan After Every Action
    visual: A huge OODA compass spins after every door the pipe-creature walks through. Observe,
      Orient, Decide, Act glow in sequence. The creature's lead pipe grows a compass for an
      eye.
    narration: "Welcome to the Compass Rotunda, where we find ourselves in the seeing-slot\
      \ of our Pipe Creature, now transformed. Previously, it was a pipe-creature whose body\
      \ was labeled type-tubes. Now, it has grown a spinning OODA compass for an eye. This\
      \ creature’s silhouette features a prominent, multifaceted crystal eye that casts beams\
      \ of organized light, symbolizing clarity in decision-making.\n\nThis visual represents\
      \ the concept of Replan After Every Action. Embabel reassesses the world after each\
      \ action taken. The plans are not fixed scripts; new objects, null, or flipped conditions\
      \ can alter the next step in real-time. Think of this as an OODA loop: Observe, Orient,\
      \ Decide, Act. \n\nConnecting back to our previous location, the Pipe Hall reminded\
      \ us that types are the wiring for our actions. Now, as our pipe-creature moves forward\
      \ with its spinning compass eye, it embodies the dynamic nature of planning in Embabel.\
      \ \n\nRecall this: What does the spinning compass represent?"
    narration_enriched: true
    overlay: REPLAN
    recall_cue: Spinning compass → replan.
    review_question: What happens after every action?
    review_answer: Replan — OODA / REPLAN
    metaphor_part: seeing-slot
    hero_now: The same creature with a spinning OODA compass for an eye.
    hero_from: A pipe-creature whose body is labeled type-tubes.
    hero_becomes: The pipe-creature with a crystalline lens eye that refracts light into patterns.
    hero_silhouette: A pipe-creature with a prominent, multifaceted crystal eye.
    hero_shot: Captured from a side angle, showcasing the refractive patterns emanating from
      the crystal eye.
    hero_tell: The crystal eye casts beams of organized light, symbolizing clarity in decision-making.
  - id: split-workbench
    seq: 3
    location: Split Workbench
    concept: Mix Code And LLM
    visual: One workbench, two arms of the same creature. The left is a Spring steel stamp
      that prints deterministic results. The right is a glowing quill that writes typed LLM
      objects. No sign, no lettering.
    narration: "Welcome to the Split Workbench in the Embabel Type-Foundry, specifically at\
      \ the hearing-slot of our Pipe Creature. This creature has just transformed from having\
      \ a spinning OODA compass for an eye to growing a steel stamp-hand and a glowing quill-hand.\
      \ \n\nThis form represents the concept of mixing code and LLM, where the steel stamp\
      \ prints deterministic results while the glowing quill writes typed LLM objects. This\
      \ concept is crucial because it blends the agency of code with the agency of LLM, making\
      \ deterministic Spring services inside @Action methods cheaper, testable, and safer.\
      \ \n\nPreviously, we were in the Compass Rotunda, focusing on how we replan after every\
      \ action. Now, as we visualize this pipe-creature with large horn speakers emitting\
      \ rhythmic pulses of sound waves, think of this as the merging of ideas. \n\nHere’s\
      \ a recall cue: what do the stamp and quill represent?"
    narration_enriched: true
    overlay: code + LLM
    recall_cue: Stamp and quill → code plus LLM.
    review_question: Must every action call an LLM?
    review_answer: Mix code and LLM
    metaphor_part: hearing-slot
    hero_now: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_from: The same creature with a spinning OODA compass for an eye.
    hero_becomes: The pipe-creature develops massive horn-like speakers on its sides.
    hero_silhouette: A pipe-creature with large horn speakers protruding from its body.
    hero_shot: Photographed from the front, highlighting the size and shape of the horn speakers.
    hero_tell: The horns emit rhythmic pulses of sound waves, representing the merging of
      ideas.
  - id: bolted-toolbox
    seq: 4
    location: Bolted Toolbox
    concept: Tools Attach Per Call
    visual: A toolbox is bolted to the quill wrist, not to the foundry walls. Wrenches sit
      in the box. A second desk has no box and the wrenches are invisible. No tags or lettering.
    narration: "We are in the scent-slot of the Pipe Creature with Compass Eye. The creature\
      \ has just grown a steel stamp-hand and a glowing quill-hand. Now, it is a toolbox bolted\
      \ only onto the quill wrist. This toolbox represents the concept: tools attach per call.\
      \ \n\nThink of this as a way to understand that tools are not permanently fixed to the\
      \ entire agent; they attach only to a specific PromptRunner at the moment they are needed.\
      \ This matters because it allows for flexibility and efficiency in processing inputs.\
      \ \n\nRecalling our previous location, the Split Workbench, where we mixed code and\
      \ LLM, now we see how the tools are narrowly scoped and only visible when called upon.\
      \ \n\nWhat does the wrist toolbox signify in terms of tool usage?"
    narration_enriched: true
    overlay: withToolObject
    recall_cue: Wrist toolbox → per-call tools.
    review_question: Where do tools attach?
    review_answer: Per call — withToolObject
    metaphor_part: scent-slot
    hero_now: A toolbox bolted only onto the quill wrist.
    hero_from: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_becomes: The pipe-creature sprouts oversized scent glands shaped like intricate filters.
    hero_silhouette: A pipe-creature with large, decorative filters attached to its body.
    hero_shot: Captured from above, emphasizing the elaborate design of the scent filters.
    hero_tell: The filters exude a diverse range of scents that represent the types of inputs
      processed.
  - id: named-crates
    seq: 5
    location: Named Crates
    concept: Bindings Beat Latest Wins
    visual: Two identical bronze crates. The unlabeled crate is latest-wins and swallows the
      first. Only the named crate opens. The creature hangs both crates from its pipes. No
      stamps or lettering.
    narration: "We are in the Foundry, at the passage-slot, where our hero is now a pipe-creature\
      \ with a swirling tunnel running through its body. This creature has grown two bronze\
      \ crates hanging from its pipes, with only one crate labeled, which represents the concept\
      \ of bindings beat latest wins. \n\nThis means that when two objects of the same type\
      \ are created, the latest one will overwrite the previous unless it has a name. If you\
      \ want to ensure the correct instance is used, you must attach a name to the binding\
      \ with outputBinding and use the technical label @RequireNameMatch. \n\nBefore this,\
      \ we saw a toolbox bolted onto the quill wrist, which emphasized that tools attach per\
      \ call. \n\nNow, recall what happens with the labeled crate. What does it represent?"
    narration_enriched: true
    overlay: '@RequireNameMatch'
    recall_cue: Labeled crate → named binding.
    review_question: How do you pick among two values of the same type?
    review_answer: Named bindings — @RequireNameMatch
    metaphor_part: passage-slot
    hero_now: Two crates hang from the pipes; only the named crate opens.
    hero_from: A toolbox bolted only onto the quill wrist.
    hero_becomes: The pipe-creature grows a spiraling passageway through its torso.
    hero_silhouette: A pipe-creature with a swirling tunnel running through its body.
    hero_shot: Photographed from the side, showcasing the depth and spiral of the passageway.
    hero_tell: The passageway's walls are lined with flowing typeface, representing the routes
      of ideas.
  - id: hat-rack
    seq: 6
    location: Hat Rack
    concept: Planner Choice
    visual: 'Four hats stack on the compass head: a cheap path cap (GOAP), a greedy gold crown
      (Utility), a gather-then-stop satchel-hat (Hybrid), and an LLM concierge top hat (Supervisor).
      Same pipe-creature, different hat, different walk.'
    narration: "Welcome to the Hat Rack, where we find ourselves at the vault-slot of our\
      \ pipe-creature, now sporting four hats stacked on its compass head. The creature has\
      \ just grown a spiraling passageway through its torso. \n\nThis new form represents\
      \ the concept of planner choice. Planner choice is a product decision. Each of the four\
      \ hats symbolizes a different planning strategy: the cheap path cap represents GOAP,\
      \ which takes the most cost-effective route to a goal; the greedy gold crown embodies\
      \ Utility, which aims for the highest net value; the gather-then-stop satchel-hat signifies\
      \ Hybrid, which collects resources before halting; and the LLM concierge top hat stands\
      \ for Supervisor, which allows the LLM to choose typed tools, offering flexibility at\
      \ a higher cost.\n\nRemember, we transitioned from the crates, where we focused on bindings\
      \ that beat the latest wins. Now, with our four hats, we think about four planners.\
      \ What do the four hats represent?"
    narration_enriched: true
    overlay: planner
    recall_cue: Four hats → four planners.
    review_question: What do the four hats mean?
    review_answer: Planner choice — GOAP, Utility, Hybrid, Supervisor
    metaphor_part: vault-slot
    hero_now: Four hats stacked on the compass head.
    hero_from: The pipe-creature grows a spiraling passageway through its torso.
    hero_becomes: The pipe-creature develops a vault-like brain, encased in a transparent
      dome.
    hero_silhouette: A pipe-creature with a dome-shaped vault for a head.
    hero_shot: Photographed from the front, highlighting the dome's transparency and contents.
    hero_tell: The vault's interior glows with pulsating ideas, symbolizing the storage of
      knowledge.
- id: floor-2
  number: 2
  title: PromptRunner And 1.5 Extras
  objective: Remember how Ai and PromptRunner create typed objects, fail softly, speak in
    messages, and — on Embabel 1.5 — think, stream, and inspect tool calls.
  recall_route: creating → ifPossible → fromMessages → thinking → stream → inspectors
  metaphor:
    region: The Model-Mouth
    role: PromptRunner And 1.5 Extras
    hero_stage: Speaking Mold with Glass Skull
    entry: The pipe-creature becomes a speaking mold
    exit: Mold Mouth [Typed Create Object] → Null Pit [Create Object If Possible] → Envelope
      Skin [Messages And Contributors] → Glass Skull [Thinking Traces] → Conveyor Spine [Streaming
      Objects] → Inspector Clipboard [Tool Call Logs]
  loci:
  - id: mold-mouth
    seq: 1
    location: Mold Mouth
    concept: Typed Create Object
    visual: The creature's mouth is a steel mold that only accepts a record-shaped ingot.
      An example ingot sits beside it. A validation stamp waits. No engraving or lettering.
    narration: "Welcome to the Mold Mouth, which is our seeing-slot. Here, the hero has transformed\
      \ from a glowing bronze type-ingot with four hats stacked on its compass head into a\
      \ record-shaped mold. This mold, made of steel, features a large, transparent spherical\
      \ glass eye embedded within it. The key detail is that the typewriter iris rotates,\
      \ typing out visible thoughts and ideas. \n\nThis represents the concept of typed createObject,\
      \ which allows Ai to generate typed objects through a PromptRunner. The process emphasizes\
      \ preferring typed createObject and creating(T).fromPrompt over free text. This matters\
      \ because it ensures clarity and structure in how we define our inputs. \n\nRecapping,\
      \ we started with a glowing bronze type-ingot and have now encountered a record-shaped\
      \ mold. Consider this: what does the record mold signify in our process?"
    narration_enriched: true
    overlay: creating(T)
    recall_cue: Record mold → typed create.
    review_question: What API creates a typed object?
    review_answer: creating(T) / createObject
    metaphor_part: seeing-slot
    hero_now: The mouth is a record-shaped mold.
    hero_from: Four hats stacked on the compass head.
    hero_becomes: A glowing glass eye with a typewriter iris.
    hero_silhouette: A large, transparent spherical glass eye embedded within the steel mold.
    hero_shot: Photographed from the perspective of the mold, capturing the glowing iris inside.
    hero_tell: The typewriter iris rotates, typing out visible thoughts and ideas.
  - id: null-pit
    seq: 2
    location: Null Pit
    concept: Create Object If Possible
    visual: Soft clay tries the mold and slumps through a dark hole. A warning lantern glows;
      nothing explodes. A side door swings open toward replan. The same creature now looks
      half-melted. No lettering.
    narration: |-
      We are in the Null Pit, focusing on the seeing-slot of our hero, which is now a half-melted clay eye that appears to sag and drip like melting wax. This organ grows from the previous record-shaped mold of the mouth. It represents the concept of createObjectIfPossible.

      This concept allows the system to attempt to create an object from incomplete prompts. If it cannot do so, it logs a warning instead of throwing an error. This null result signals the need to replan, often involving human input.

      Recall that we just came from the Mold Mouth, which was the typed create object stage. Now, think of how the slumping clay eye reveals hidden messages within. What does the slump hole represent?
    narration_enriched: true
    overlay: createObjectIfPossible
    recall_cue: Slump hole → null then replan.
    review_question: What does createObjectIfPossible return when the prompt is incomplete?
    review_answer: null, then replan
    metaphor_part: seeing-slot
    hero_now: Half-melted clay slumping through a null hole.
    hero_from: The mouth is a record-shaped mold.
    hero_becomes: A dripping clay eye with a lens-like pupil.
    hero_silhouette: A bulbous clay eye that appears to sag and drip like melting wax.
    hero_shot: Captured from above, focusing on the melting edges and the lens pupil.
    hero_tell: The lens pupil refracts light, revealing hidden messages within.
  - id: envelope-skin
    seq: 3
    location: Envelope Skin
    concept: Messages And Contributors
    visual: The clay grows envelope-skin. A system-colored sash and a user-colored sash stack
      in order. A single fat string scroll is crossed out. No etched words.
    narration: "We are in the seeing-slot of the Model-Mouth region, where the creature now\
      \ takes the form of a large, flat eye resembling a sealed envelope, with subtle folds.\
      \ This eye has evolved from half-melted clay slumping through a null hole, and it is\
      \ designed to represent the concept of messages and contributors. \n\nThink of this\
      \ as how prompt contributors build requests from structured messages rather than a single\
      \ concatenated blob. The eye opens like an envelope, displaying texts and symbols inside,\
      \ which is essential for the system and user messages to interact through fromMessages.\
      \ \n\nPreviously, we encountered the Null Pit, where we considered the creation of objects\
      \ if possible. Now, we see that the envelope-skin allows for a distinct exchange of\
      \ information. Recall the image of stacked envelopes. What does fromMessages represent?"
    narration_enriched: true
    overlay: fromMessages
    recall_cue: Stacked envelopes → fromMessages.
    review_question: How should prompts be structured?
    review_answer: fromMessages — SystemMessage plus UserMessage
    metaphor_part: seeing-slot
    hero_now: The same body wearing System and User envelopes.
    hero_from: Half-melted clay slumping through a null hole.
    hero_becomes: An envelope-shaped eye that opens and closes with messages.
    hero_silhouette: A large, flat eye resembling a sealed envelope, with subtle folds.
    hero_shot: Photographed from the front as it opens to reveal shifting contents.
    hero_tell: The eye opens like an envelope, displaying texts and symbols inside.
  - id: glass-skull
    seq: 4
    location: Glass Skull
    concept: Thinking Traces
    visual: A glass skull grows on the envelope body. Inside, a silent ticker of thought-light
      pulses. No printed words, no labeled gates, no badge lettering.
    narration: "Welcome to the Glass Skull, located in the seeing-slot of our Embabel Type-Foundry.\
      \ Here we see a glass skull ticking decision reasoning. This glass skull is the embodiment\
      \ of the concept of thinking traces. \n\nThinking traces represent how the system captures\
      \ and displays a mosaic of thoughts, much like a crystal ball, allowing for a deeper\
      \ understanding of decision-making processes. This is crucial, as it enables explicit\
      \ rationale alongside typed results in Embabel 1.5.\n\nPreviously, we encountered the\
      \ Envelope Skin, where messages and contributors were housed. Now, we can visualize\
      \ the glass skull with its shimmering orb above, swirling thoughts visible within. Recall\
      \ this: Glass skull ticker leads us to thinking traces. What does the glass skull represent?"
    narration_enriched: true
    overlay: thinking()
    recall_cue: Glass skull ticker → thinking traces.
    review_question: What does thinking() add in Embabel 1.5?
    review_answer: Thinking traces — ThinkingResponse
    metaphor_part: seeing-slot
    hero_now: A glass skull ticking decision reasoning.
    hero_from: The same body wearing System and User envelopes.
    hero_becomes: A crystal-clear eye with swirling thoughts visible inside.
    hero_silhouette: A glassy orb that appears to float above the skull, shimmering with light.
    hero_shot: From a side angle, capturing the swirling thoughts inside the clear eye.
    hero_tell: The eye captures and displays a mosaic of thoughts like a crystal ball.
  - id: conveyor-spine
    seq: 5
    location: Conveyor Spine
    concept: Streaming Objects
    visual: The spine becomes a conveyor. Glass-brick packets arrive one by one and freeze
      into typed records. A stopwatch hangs. No badges or lettering.
    narration: "We are in the seeing-slot of the Model-Mouth, where we find a conveyor spine\
      \ turning JSON into records. This hero just was a glass skull ticking decision reasoning,\
      \ but now it has transformed into an eye with a moving conveyor belt running through\
      \ its center, displaying images. This silhouette encodes the concept of streaming objects.\n\
      \nStreaming objects allow us to emit typed objects as they arrive, which is crucial\
      \ for processing data efficiently. Think of this as a continuous flow of information,\
      \ similar to how a conveyor belt operates. \n\nRecalling our previous location, the\
      \ glass skull represented thinking traces. Now, we are witnessing how that thought materializes\
      \ into streaming data. \n\nHere’s a quick recall question: How do we process data one\
      \ brick at a time?"
    narration_enriched: true
    overlay: createObjectStream
    recall_cue: One brick at a time → stream.
    review_question: What emits typed objects as they arrive?
    review_answer: createObjectStream
    metaphor_part: seeing-slot
    hero_now: A conveyor spine turning JSON into records.
    hero_from: A glass skull ticking decision reasoning.
    hero_becomes: A conveyor belt eye that streams visual data.
    hero_silhouette: An eye with a moving conveyor belt running through its center, displaying
      images.
    hero_shot: Captured from below, showcasing the images as they pass through the eye.
    hero_tell: The eye projects images like a film reel as data flows continuously.
  - id: inspector-clipboard
    seq: 6
    location: Inspector Clipboard
    concept: Tool Call Logs
    visual: An inspector clipboard grows as the last organ. It photographs every wrench swing
      from the wrist toolbox. Wrenches hang in view. The mold-mouth waits to print a typed
      plan. No lettering on the clipboard.
    narration: |-
      We are now in the seeing-slot of the Model-Mouth, where the creature has transformed from a conveyor spine turning JSON into records into an inspector clipboard that watches the wrist toolbox. Imagine this clipboard organ as a large, camera-like eye with a shutter that clicks as it observes. This eye captures images, preserving every action it observes, making it essential for logging tool calls.

      This inspector clipboard encodes the concept of tool call logs. Tool call logs help track the methods used, such as @LlmTool or @Tool, and connect them with withToolObject. In Embabel 1.5, we add withToolCallInspectors to log each call, ensuring that the model uses the tools before writing the typed result.

      Previously, we were at the conveyor spine, streaming objects, and now we are at the inspector clipboard, capturing each moment of action. Recall the clipboard photo—what does it record?
    narration_enriched: true
    overlay: withToolCallInspectors
    recall_cue: Clipboard photo → inspected tool call.
    review_question: How do you log tool calls in Embabel 1.5?
    review_answer: withToolCallInspectors
    metaphor_part: seeing-slot
    hero_now: A clipboard organ watching the wrist toolbox.
    hero_from: A conveyor spine turning JSON into records.
    hero_becomes: An inspector eye that records actions with a shutter mechanism.
    hero_silhouette: A large, camera-like eye with a shutter that clicks as it observes.
    hero_shot: Photographed as the eye blinks, capturing a moment in time.
    hero_tell: The eye clicks and captures images, preserving every action it observes.
recall:
  enabled: true
  intro: 'End the video with locations only. Ask the learner to name the concept, then reveal:'
  floors:
  - floor: floor-1
    label: Mental model
    answer: Types → Replan → Code+LLM → Per-call tools → Named bindings → Planner hats
  - floor: floor-2
    label: PromptRunner
    answer: creating → ifPossible → fromMessages → thinking → stream → inspectors
extras:
  front_matter:
    core rule: One locus = one concept. One memorable image = one retrieval hook.
  sections:
    building-overview: |-
      # 1. Building Overview

      The foundry has two floors that match the cheat sheet, not cookbook
      chapters:

      1.  **Floor 1 --- 1.0 mental model:** Types, replan, code+LLM, tools
          per call, named bindings, planner hats.
      2.  **Floor 2 --- PromptRunner + 1.5 extras:** `creating`,
          `createObjectIfPossible`, messages, thinking, streaming,
          inspectors.

      Teaching source: `docs/CHEATSHEET.md`. Dual versions:
      `docs/VERSIONS.md`. Official recipes stay in the Cookbook; this
      palace is the recall list.
    study-map: |-
      # 5. Study Map

      Cheat sheet: `docs/CHEATSHEET.md`

      Versions: `docs/VERSIONS.md` — default 1.0; `-Pembabel-15` for extras.

      Official sources (extracted, not cloned):

      - User Guide: https://docs.embabel.com/embabel-agent/guide/1.5.0-SNAPSHOT/
      - Cookbook 1.5: https://docs.embabel.com/embabel-cookbook/1.5.0/
