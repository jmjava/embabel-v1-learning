  - id: split-workbench
    seq: 3
    location: Split Workbench
    concept: Mix Code And LLM
    visual: In an industrial freight elevator under lightning flashes, the same bronze pipe-creature
      grows a massive spring-steel stamp hand and a glowing quill hand. Hammered copper walls.
      No lettering on the walls.
    visual_enriched: true
    narration: |-
      Welcome to the Split Workbench in the Embabel Type-Foundry, where we find our Pipe-Creature in the hearing-slot. It has just transformed from a creature with a spinning OODA compass for an eye to one with a steel stamp-hand and a glowing quill-hand. This silhouette embodies the concept of mixing code and LLM, where the steel stamp thuds firmly, representing deterministic results, while the soft glow of the quill signifies the creation of typed LLM objects.

      This concept matters because it allows us to mix code agency with LLM agency effectively. The deterministic Spring services inside @Action methods are cheaper, testable, and safer. Remember that not every action needs a model; we want to use the model only at the typed boundary.

      Now recall the previous location, the Compass Rotunda, where we learned about planning after every action. What do the stamp and quill represent?
    narration_enriched: true
    overlay: code + LLM
    recall_cue: Stamp and quill → code plus LLM.
    review_question: Must every action call an LLM?
    review_answer: Mix code and LLM
    metaphor_part: hearing-slot
    hero_now: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_from: The same creature with a spinning OODA compass for an eye.
    hero_becomes: A toolbox bolted only onto the quill wrist.
    hero_silhouette: The creature now has a quill hand and a stamped hand, both active.
    hero_shot: A close-up of the creature using the stamp to print while the quill writes.
    hero_tell: The steel stamp thuds firmly, juxtaposed with the soft glow of the quill.
