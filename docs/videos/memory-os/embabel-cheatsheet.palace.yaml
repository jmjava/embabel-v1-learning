  - id: named-crates
    seq: 5
    location: Named Crates
    concept: Bindings Beat Latest Wins
    visual: In a freight elevator under harsh green-white fluorescents, two identical bronze
      crates hang from the pipe-creature. One crate stays sealed and hungry; the other clicks
      open when named. Violet neon on the opening crate. No stamps or lettering.
    visual_enriched: true
    narration: "Welcome to the Foundry, specifically at the passage-slot. Here we see our\
      \ hero, a Pipe-Creature, which just transitioned from a toolbox bolted only onto the\
      \ quill wrist. Now, it has grown into a remarkable form featuring two crates that hang\
      \ from its pipes, with a compass head adorned with hats. \n\nThis unique configuration\
      \ embodies the concept of Bindings Beat Latest Wins. This means that the latest object\
      \ of a type wins unless you name it specifically. The creature displays two identical\
      \ bronze crates: the unlabeled crate, representing the latest-wins rule, swallows the\
      \ first, while the named crate responds with a click when the correct name is provided.\n\
      \nConnecting back to our previous location, the bolted toolbox highlighted how tools\
      \ attach per call. Now, notice how these crates interact with the creature's function.\
      \ \n\nAs we ponder this, consider: which crate responds with a click?"
    narration_enriched: true
    overlay: '@RequireNameMatch'
    recall_cue: Labeled crate → named binding.
    review_question: How do you pick among two values of the same type?
    review_answer: Named bindings — @RequireNameMatch
