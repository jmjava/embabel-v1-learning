memoryos: 1
palace:
  id: embabel-cheatsheet
  title: Embabel Cheat Sheet Memory Palace
  purpose: Generate a guided study video that teaches Embabel from the learning-repo cheat
    sheet — planner rules first, then PromptRunner APIs — as a two-floor memory palace.
  audience: JVM engineers who know Spring and want Embabel 1.0 plus 1.5 extras as recallable
    rooms, not a slide deck and not a cookbook travel plot.
  learning_method: Method of loci / memory palace. Every locus must have one dominant concept,
    one exaggerated visual mnemonic, and one concise technical explanation.
  style:
    visual: First-person cinematic walkthrough of one living type-foundry. The narrator physically
      moves from locus to locus. Technical labels appear briefly as clean overlays. Visuals
      should be exaggerated, memorable, and slightly absurd without becoming distracting.
      Every locus is the next metamorphosis of the same hero — never a reused generic hallway
      and never a new disconnected prop.
    narration: Calm technical instructor. Explain the mnemonic first, then connect it to the
      Embabel rule. Pause briefly between loci to encourage active recall.
  metaphor:
    name: Embabel Type-Foundry
    throughline: The palace is one living type-foundry. We enter as raw input and the building
      grows pipes, organs, and stamps as Embabel plans, then opens a mouth that speaks typed
      objects.
    material: Bronze and glass with teal light illuminating the space.
    hero: A glowing bronze type-ingot that starts unlabeled, sprouts typed pipes and a compass
      eye, grows a split workbench and a bolted toolbox, then becomes a mold-mouth that can
      slump through a dark hole, wear envelope-skin, think in a glass skull, stream glass-brick
      vertebrae, and sprout an inspector clipboard.
    hero_origin: A sealed unlabeled bronze seed held in the foundry gate.
    progression: head-slot → seeing-slot → hearing-slot → scent-slot → passage-slot → vault-slot
      → works-slot → grasp-slot → stand-slot → exit-slot
    camera: first-person, inside the living type-foundry, looking at the next organ.
    hero_scale: The type-ingot fills the frame, its bronze surface glowing with energy.
    planned: true
floors:
- id: floor-1
  number: 1
  title: 1.0 Mental Model
  objective: 'Remember the rules that stay true on Embabel 1.0 and 1.5: types are the wiring,
    the process replans after every action, tools attach per call, and planner choice is a
    product decision.'
  recall_route: Types → Replan → Code+LLM → Per-call tools → Named bindings → Planner hats
  metaphor:
    region: The Foundry
    role: Mental Model
    hero_stage: Pipe-Creature
    entry: The seed opens into a pipe-creature, revealing a network of glowing bronze pipes.
    exit: The glowing pipes lead to a Compass Rotunda.
  loci:
  - id: pipe-hall
    seq: 1
    location: Pipe Hall
    concept: Types Are The Wiring
    visual: Giant empty glass pipes snake through the hall. The bronze seed splits and becomes
      a pipe-creature whose body is those tubes. Source-order stepping stones are absent.
      No lettering.
    narration: 'Welcome to the Pipe Hall, where we have reached the head-slot of our Pipe-Creature.
      This creature has transformed from a sealed unlabeled bronze seed held in the foundry
      gate into a pipe-creature whose body is made of interconnected glass type-tubes. Think
      of this as the concept: types are the wiring. Actions do not run in source order. GOAP
      walks blackboard types. Returning a new type posts an effect, so design domain objects
      carefully — they are the control flow. Recall this: glass pipes represent that types
      are the wiring. What will the next organ be?'
    narration_enriched: true
    overlay: '@Action types'
    recall_cue: Glass pipes → types are the wiring.
    review_question: What do return types do in GOAP?
    review_answer: Types are the wiring — @Action types
    key_distinction: Source order is not execution order.
    metaphor_part: head-slot
    hero_now: A pipe-creature whose body is glass type-tubes.
    hero_from: A sealed unlabeled bronze seed held in the foundry gate.
    hero_becomes: A pipe-creature with a spinning brass compass for an eye.
    hero_silhouette: A creature made of interconnected glass tubes, shaped like a twisting
      pipe.
    hero_shot: Captured from above, highlighting the intricate network of glowing glass tubes
      that form the creature's body.
    hero_tell: The creature's head is a complex arrangement of glass tubes that reflect the
      teal light.
    must_show:
    - A pipe-creature made of glass tubes
    - A complex head of glass tubes reflecting light
    stamp_text:
    - Types are the wiring
    visible:
    - glass tubes
    - green grass-like base
    - gray walls
    - blue light
    - benches along the walls
    visible_hero: glass tube creature
    visible_setting: a brightly lit, minimalistic room
    grounded: true
  - id: compass-rotunda
    seq: 2
    location: Compass Rotunda
    concept: Replan After Every Action
    visual: A huge brass compass spins after every door the pipe-creature walks through. Four
      glowing quadrants pulse in sequence. The creature's lead pipe grows a compass for an
      eye. No painted letters on the dial.
    narration: Welcome to the Compass Rotunda, in the seeing-slot of our Pipe-Creature. Here
      we have the same creature, now with a spinning brass compass for an eye. Think of this
      as the concept of Replan After Every Action. After each action, Embabel reassesses the
      world. Plans are flexible, adapting to new objects or changing conditions. This is part
      of the OODA loop, essential for effective decision-making. Recall the previous location,
      the Pipe Hall, where types serve as the wiring. What does the spinning compass represent?
    narration_enriched: true
    overlay: REPLAN
    recall_cue: Spinning compass → replan.
    review_question: What happens after every action?
    review_answer: Replan — OODA / REPLAN
    metaphor_part: seeing-slot
    hero_now: The same creature with a spinning brass compass for an eye.
    hero_from: A pipe-creature whose body is glass type-tubes.
    hero_becomes: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_silhouette: A pipe-creature with a prominent spinning brass compass embedded in its
      head.
    hero_shot: Captured from the side, showcasing the creature's glowing eye and the surrounding
      pipes.
    hero_tell: The eye is a brass compass that spins continuously, guiding the creature's
      perception.
    must_show:
    - Pipe-Creature with a spinning brass compass eye
    - Glowing pipes surrounding the creature
    stamp_text:
    - REPLAN
    visible:
    - glowing pipes
    - dark blue walls
    - shadowed floor
    - dim light beam
    visible_hero: the pipe-creature with a compass eye
    visible_setting: a dark, enclosed corridor with blue walls
    grounded: true
  - id: split-workbench
    seq: 3
    location: Split Workbench
    concept: Mix Code And LLM
    visual: One workbench, two arms of the same creature. The left is a Spring steel stamp
      that prints deterministic results. The right is a glowing quill that writes typed LLM
      objects. No sign, no lettering.
    narration: 'Welcome to the Split Workbench in the Embabel Type-Foundry. Here, the Pipe-Creature
      has transformed from a glowing bronze type-ingot with a spinning brass compass for an
      eye into a creature with two distinct arms: one is a steel stamp-hand, and the other
      is a glowing quill-hand. This planned form encodes the concept of mixing code and LLM.
      This means we can combine deterministic Spring services inside Action methods—these
      are cheaper, testable, and safer. Remember, the previous location emphasized replanning
      after every action with the compass eye. Now, think about how the stamp and quill together
      represent code plus LLM. What do these two hands create?'
    narration_enriched: true
    overlay: code + LLM
    recall_cue: Stamp and quill → code plus LLM.
    review_question: Must every action call an LLM?
    review_answer: Mix code and LLM
    metaphor_part: hearing-slot
    hero_now: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_from: The same creature with a spinning brass compass for an eye.
    hero_becomes: A toolbox bolted only onto the quill wrist.
    hero_silhouette: Creature with a steel stamp-hand and a glowing quill-hand
    hero_shot: Captured at a low angle, highlighting the dual hands in action over a workbench.
    hero_tell: One arm is a rigid steel stamp that clicks with each print, creating audible
      impressions.
    must_show:
    - A creature with a steel stamp-hand and glowing quill-hand
    - A split workbench with both hands in action
    stamp_text:
    - code + LLM
    visible:
    - robot with clock face
    - metal workbench
    - stamped letters
    - glowing quill
    - window with rain
    - stormy sky
    visible_hero: a robot-like creature using a stamp and a quill
    visible_setting: a dimly lit workshop with a single window showing a storm outside
    grounded: true
  - id: bolted-toolbox
    seq: 4
    location: Bolted Toolbox
    concept: Tools Attach Per Call
    visual: A toolbox is bolted to the quill wrist, not to the foundry walls. Wrenches sit
      in the box. A second desk has no box and the wrenches are invisible. No tags or lettering.
    narration: Welcome to the scent-slot of our Pipe-Creature in the Foundry. Here, the creature
      has grown a bolted toolbox attached to its glowing quill arm. Wrenches sit in that box.
      Think of this as the concept of tools attaching per call. Tools attach to a PromptRunner,
      not the whole agent forever. Tool and LlmTool methods stay invisible until that call
      chain attaches them. Previously we had the split workbench, which mixed code and LLM.
      Scope tools narrowly. Can you recall where the toolbox is bolted?
    narration_enriched: true
    overlay: withToolObject
    recall_cue: Wrist toolbox → per-call tools.
    review_question: Where do tools attach?
    review_answer: Per call — withToolObject
    metaphor_part: scent-slot
    hero_now: A toolbox bolted only onto the quill wrist.
    hero_from: The creature grows a steel stamp-hand and a glowing quill-hand.
    hero_becomes: Two crates hang from the pipes; only the named crate opens.
    hero_silhouette: A creature with a toolbox attached to its quill arm, featuring various
      tools inside.
    hero_shot: Captured in a close-up, focusing on the toolbox with its lid slightly ajar,
      revealing the tools within.
    hero_tell: The toolbox emits a faint metallic scent, like freshly cut steel.
    must_show:
    - A creature with a toolbox attached to its quill arm
    - Wrenches sitting in the bolted toolbox
    stamp_text:
    - withToolObject
    visible:
    - toolbox
    - wrenches
    - dim lamp
    - plaid wall
    - creature
    - shadow
    visible_hero: the creature holding the toolbox
    visible_setting: a dimly lit room with a decorative wall
    grounded: true
  - id: named-crates
    seq: 5
    location: Named Crates
    concept: Bindings Beat Latest Wins
    visual: Two identical bronze crates. The unlabeled crate is latest-wins and swallows the
      first. Only the named crate opens. The creature hangs both crates from its pipes. No
      stamps or lettering.
    narration: 'We are now in the passage-slot of our Pipe-Creature. The creature, which was
      just a bolted toolbox, has transformed into a unique form: two bronze crates hang from
      its pipes, and only the named crate opens. This form encodes the concept of bindings
      beat latest wins. The latest object of a type wins unless you name it. Use outputBinding
      plus RequireNameMatch when two values share a type, or the wrong instance surprises
      you. Remember, we just came from the toolbox, where tools attach per call. Can you recall
      which crate opens?'
    narration_enriched: true
    overlay: '@RequireNameMatch'
    recall_cue: Labeled crate → named binding.
    review_question: How do you pick among two values of the same type?
    review_answer: Named bindings — @RequireNameMatch
    metaphor_part: passage-slot
    hero_now: Two crates hang from the pipes; only the named crate opens.
    hero_from: A toolbox bolted only onto the quill wrist.
    hero_becomes: Four hats stacked on the compass head.
    hero_silhouette: Pipe-creature hanging two bronze crates from its pipes
    hero_shot: Captured from below, emphasizing the creature's balance and the crates hanging
      below.
    hero_tell: The named crate has a distinct aroma of cedar wood, contrasting with the metallic
      scent.
    must_show:
    - A Pipe-Creature balancing two bronze crates
    - Only the named crate opens
    stamp_text:
    - '@RequireNameMatch'
    visible:
    - two bronze crates
    - neon lights
    - dark walls
    - elevator floor
    visible_hero: the Pipe-Creature
    visible_setting: a dimly lit, futuristic elevator with neon accents
    grounded: true
  - id: hat-rack
    seq: 6
    location: Hat Rack
    concept: Planner Choice
    visual: 'Four hats stack on the compass head: a cheap path cap (GOAP), a greedy gold crown
      (Utility), a gather-then-stop satchel-hat (Hybrid), and an LLM concierge top hat (Supervisor).
      Same pipe-creature, different hat, different walk.'
    narration: 'Welcome to the Foundry, in the vault-slot of our Pipe-Creature. The creature
      we see now is a glowing bronze type-ingot that has transformed into a fascinating form:
      four hats stacked on the compass head. Each hat represents a different planning style,
      which is the concept of planner choice. Planner choice is a product decision that determines
      how the creature will behave. The cheap path cap, greedy gold crown, gather-then-stop
      satchel-hat, and LLM concierge top hat each guide our actions differently. Remember,
      four hats represent four planners. How do they influence decisions?'
    narration_enriched: true
    overlay: planner
    recall_cue: Four hats → four planners.
    review_question: What do the four hats mean?
    review_answer: Planner choice — GOAP, Utility, Hybrid, Supervisor
    metaphor_part: vault-slot
    hero_now: Four hats stacked on the compass head.
    hero_from: Two crates hang from the pipes; only the named crate opens.
    hero_becomes: The creature's mouth becomes a record-shaped mold.
    hero_silhouette: A creature with a multi-hatted head, each hat representing a different
      planning style.
    hero_shot: Captured from the front, showcasing the variety of hats and their symbolic
      meanings.
    hero_tell: The hats are adorned with intricate patterns that shimmer in the teal light.
    must_show:
    - A creature with a multi-hatted head
    - Four hats stacked on the compass head
    - Intricate patterns on the hats
    stamp_text:
    - planner
    visible:
    - four stacked hats
    - golden hand
    - purple walls
    - neon light accents
    visible_hero: a creature with a multi-hatted head
    visible_setting: a dimly lit, stylized room with purple walls
    grounded: true
- id: floor-2
  number: 2
  title: PromptRunner And 1.5 Extras
  objective: Remember how Ai and PromptRunner create typed objects, fail softly, speak in
    messages, and — on Embabel 1.5 — think, stream, and inspect tool calls.
  recall_route: creating → ifPossible → fromMessages → thinking → stream → inspectors
  metaphor:
    region: The Model-Mouth
    role: PromptRunner And 1.5 Extras
    hero_stage: Mold Mouth
    entry: The pipe-creature transforms into a speaking mold with a glowing teal interior.
    exit: The mold-mouth speaks into a Null Pit.
  loci:
  - id: mold-mouth
    seq: 1
    location: Mold Mouth
    concept: Typed Create Object
    visual: The creature's mouth is a steel mold that only accepts a record-shaped ingot.
      An example ingot sits beside it. A validation stamp waits. No engraving or lettering.
    narration: Welcome to the Mold Mouth, which is our seeing-slot. Here, the mouth takes
      the form of a record-shaped mold. This mold encodes the concept of typed create object.
      Prefer typed createObject and creating T fromPrompt over free text. Ai gives you a PromptRunner.
      Remember, this mold was once a glowing bronze type-ingot with four hats stacked on its
      compass head. As we look closely, can you recall what type of ingot it accepts?
    narration_enriched: true
    overlay: creating(T)
    recall_cue: Record mold → typed create.
    review_question: What API creates a typed object?
    review_answer: creating(T) / createObject
    metaphor_part: seeing-slot
    hero_now: The mouth is a record-shaped mold.
    hero_from: Four hats stacked on the compass head.
    hero_becomes: A glowing glass skull forms above the mold.
    hero_silhouette: A wide steel mold with a glowing teal interior.
    hero_shot: Capture the mold from the front, focusing on the record shape.
    hero_tell: It only accepts record-shaped ingots.
    must_show:
    - A wide steel mold with a glowing teal interior
    stamp_text:
    - creating(T)
    grounded: true
  - id: null-pit
    seq: 2
    location: Null Pit
    concept: Create Object If Possible
    visual: Soft clay tries the mold and slumps through a dark hole. A warning lantern glows;
      nothing explodes. A side door swings open toward replan. The same creature now looks
      half-melted. No lettering.
    narration: Welcome to the Null Pit, the seeing-slot of our type-foundry creature. Here,
      our hero is a soft, half-melted mass of clay that has just emerged from a record-shaped
      mold. This unique form represents the concept of createObjectIfPossible. It symbolizes
      how incomplete prompts can return null, log a warning, and avoid throwing errors. This
      is crucial because a null result signals the need to replan, often leading to human-in-the-loop
      interactions. Previously, we had the Mold Mouth, which created typed objects. Now, can
      you recall what happens when we slump through the hole?
    narration_enriched: true
    overlay: createObjectIfPossible
    recall_cue: Slump hole → null then replan.
    review_question: What does createObjectIfPossible return when the prompt is incomplete?
    review_answer: null, then replan
    metaphor_part: seeing-slot
    hero_now: Half-melted clay slumping through a dark hole.
    hero_from: The mouth is a record-shaped mold.
    hero_becomes: The clay grows envelope-skin around its form.
    hero_silhouette: A soft, half-melted mass.
    hero_shot: Photograph the clay as it melts, showing the dark hole behind it.
    hero_tell: The clay oozes toward a warning lantern.
    must_show:
    - A soft, half-melted mass of clay
    - The clay oozes toward a warning lantern
    stamp_text:
    - createObjectIfPossible
    visible:
    - the warning lantern
    - a wooden mannequin pointing
    - the walls adorned with purple hue
    - a cast shadow on the floor
    - a subtle outline of the clay's surface
    visible_hero: the soft, half-melted mass of clay
    visible_setting: a dimly lit, colorful room with a surreal atmosphere
    grounded: true
  - id: envelope-skin
    seq: 3
    location: Envelope Skin
    concept: Messages And Contributors
    visual: The clay grows envelope-skin. A system-colored sash and a user-colored sash stack
      in order. A single fat string scroll is crossed out. No etched words.
    narration: We are in the seeing-slot of the Model-Mouth region, and our hero now is a
      clay mass covered in colorful envelopes. This envelope-skin grows as it embodies the
      concept of messages and contributors. Think of this as how prompt contributors build
      requests from structured messages, not a single concatenated blob. SystemMessage plus
      UserMessage are combined through fromMessages. Previously, we were in the Null Pit,
      where the clay was half-melted and slumping through a dark hole. Can you recall the
      stacked envelopes?
    narration_enriched: true
    overlay: fromMessages
    recall_cue: Stacked envelopes → fromMessages.
    review_question: How should prompts be structured?
    review_answer: fromMessages — SystemMessage plus UserMessage
    metaphor_part: seeing-slot
    hero_now: The same body wearing stacked system and user envelopes.
    hero_from: Half-melted clay slumping through a dark hole.
    hero_becomes: A glass skull grows above the envelope body.
    hero_silhouette: A clay mass covered in colorful envelopes.
    hero_shot: Capture the envelopes from the side, showing their stacked nature.
    hero_tell: The envelopes are labeled with abstract colors.
    must_show:
    - A clay mass covered in colorful envelopes
    - Envelopes labeled with abstract colors
    stamp_text:
    - fromMessages
    visible:
    - brown clay mass
    - colorful envelopes
    - green walls
    - green floor
    - stylized figure
    visible_hero: the clay mass covered in colorful envelopes
    visible_setting: a stylized, surreal room with a clay mass and colorful envelopes.
    grounded: true
  - id: glass-skull
    seq: 4
    location: Glass Skull
    concept: Thinking Traces
    visual: A glass skull grows on the envelope body. Inside, a silent ticker of thought-light
      pulses. No printed words, no labeled gates, no badge lettering.
    narration: We are now at the seeing-slot of the Glass Skull, which has transformed from
      the stacked system and user envelopes. The hero now is a translucent skull pulsing with
      light, representing the concept of thinking traces. This glass skull has thought-light
      pulsing through it, encoding how thinking() operates in Embabel 1.5. It requires an
      explicit rationale and a typed result, activating only when supportsThinking() is true.
      Remember, this connects back to the envelope skin that communicated messages. What does
      the glass skull represent?
    narration_enriched: true
    overlay: thinking()
    recall_cue: Glass skull ticker → thinking traces.
    review_question: What does thinking() add in Embabel 1.5?
    review_answer: Thinking traces — ThinkingResponse
    metaphor_part: seeing-slot
    hero_now: A glass skull ticking decision reasoning.
    hero_from: The same body wearing stacked system and user envelopes.
    hero_becomes: The spine transforms into a conveyor.
    hero_silhouette: A translucent skull pulsing with light.
    hero_shot: Photograph the skull from above, highlighting the ticker inside.
    hero_tell: Thought-light pulses through the glass.
    must_show:
    - Translucent skull pulsing with light
    stamp_text:
    - thinking()
    visible:
    - stairs in the background
    - character pointing
    - top hat on the character
    - greenish hue surrounding the scene
    visible_hero: translucent glowing skull
    visible_setting: an eerie, dimly lit room with a dark background.
    grounded: true
  - id: conveyor-spine
    seq: 5
    location: Conveyor Spine
    concept: Streaming Objects
    visual: The spine becomes a conveyor. Glass-brick packets arrive one by one and freeze
      into typed records. A stopwatch hangs. No badges or lettering.
    narration: We are in the seeing-slot, looking at the conveyor spine. This glowing bronze
      type-ingot has transformed into a conveyor spine, which is the concept of streaming
      objects. createObject waits. Streaming emits typed objects as they arrive. Wrap the
      runner in StreamingPromptRunnerBuilder, call createObjectStream, and collect with doOnNext.
      Guard on supportsStreaming. The conveyor spine turns glass bricks into records, where
      each brick freezes into a typed object as it arrives. Previously, we had the glass skull,
      which reasoned through decisions. Recall how bricks arrive one at a time — what does
      it mean to stream?
    narration_enriched: true
    overlay: createObjectStream
    recall_cue: One brick at a time → stream.
    review_question: What emits typed objects as they arrive?
    review_answer: createObjectStream
    metaphor_part: seeing-slot
    hero_now: A conveyor spine turning glass bricks into records.
    hero_from: A glass skull ticking decision reasoning.
    hero_becomes: An inspector clipboard grows as the last organ.
    hero_silhouette: A spine lined with glass bricks moving rhythmically.
    hero_shot: Capture the conveyor in motion, emphasizing the bricks.
    hero_tell: The bricks freeze into typed records.
    must_show:
    - A conveyor spine lined with glass bricks
    - The bricks freeze into typed records
    stamp_text:
    - createObjectStream
    visible:
    - mannequin pointing
    - tall hat
    - wooden wall
    - light fixtures
    - dark red wall
    visible_hero: a conveyor belt lined with glass-like blocks
    visible_setting: a dimly lit corridor with a conveyor
    grounded: true
  - id: inspector-clipboard
    seq: 6
    location: Inspector Clipboard
    concept: Tool Call Logs
    visual: An inspector clipboard grows as the last organ. It photographs every wrench swing
      from the wrist toolbox. Wrenches hang in view. The mold-mouth waits to print a typed
      plan. No lettering on the clipboard.
    narration: Welcome to the Model-Mouth, the seeing-slot of our living type-foundry. Here,
      our hero form is the clipboard organ, which has grown from the conveyor spine that was
      turning glass bricks into records. This clipboard encodes the concept of tool call logs.
      Mark methods LlmTool or Tool, attach them with withToolObject, and on 1.5 add withToolCallInspectors
      to log each call. The clipboard photographs every swing from the wrist toolbox. Invisible
      tools are the classic bug. Remember, this clipboard connects to our previous conveyor
      spine, which streamed objects. Can you recall what the clipboard captures?
    narration_enriched: true
    overlay: withToolCallInspectors
    recall_cue: Clipboard photo → inspected tool call.
    review_question: How do you log tool calls in Embabel 1.5?
    review_answer: withToolCallInspectors
    metaphor_part: seeing-slot
    hero_now: A clipboard organ watching the wrist toolbox.
    hero_from: A conveyor spine turning glass bricks into records.
    hero_becomes: The finished living foundry, ready for recall.
    hero_silhouette: A clipboard with a mechanical arm holding a wrench.
    hero_shot: Photograph the clipboard from a slight angle, showing its detail.
    hero_tell: It photographs every swing from the wrist toolbox.
    must_show:
    - Clipboard organ with a mechanical arm
    - Wrist toolbox with visible wrenches
    stamp_text:
    - tool call logs
    visible:
    - clipboard
    - wrench
    - toolbox
    - window
    - light
    - wall
    - floor
    visible_hero: a stylized figure with a hat and mechanical arm holding a clipboard
    visible_setting: a dimly lit room with large windows offering a glimpse of the outside.
    grounded: true
recall:
  enabled: true
  intro: 'End the video with locations only. Ask the learner to name the concept, then reveal:'
  floors:
  - floor: floor-1
    label: Mental model
    answer: Types → Replan → Code+LLM → Per-call tools → Named bindings → Planner hats
  - floor: floor-2
    label: PromptRunner
    answer: creating → ifPossible → fromMessages → thinking → stream → inspectors
extras:
  front_matter:
    core rule: One locus = one concept. One memorable image = one retrieval hook.
  sections:
    building-overview: |-
      # 1. Building Overview

      The foundry has two floors that match the cheat sheet, not cookbook
      chapters:

      1.  **Floor 1 --- 1.0 mental model:** Types, replan, code+LLM, tools
          per call, named bindings, planner hats.
      2.  **Floor 2 --- PromptRunner + 1.5 extras:** `creating`,
          `createObjectIfPossible`, messages, thinking, streaming,
          inspectors.

      Teaching source: `docs/CHEATSHEET.md`. Dual versions:
      `docs/VERSIONS.md`. Official recipes stay in the Cookbook; this
      palace is the recall list.
    study-map: |-
      # 5. Study Map

      Cheat sheet: `docs/CHEATSHEET.md`

      Versions: `docs/VERSIONS.md` — default 1.0; `-Pembabel-15` for extras.

      Official sources (extracted, not cloned):

      - User Guide: https://docs.embabel.com/embabel-agent/guide/1.5.0-SNAPSHOT/
      - Cookbook 1.5: https://docs.embabel.com/embabel-cookbook/1.5.0/
