- id: floor-2
  number: 2
  title: PromptRunner And 1.5 Extras
  objective: Remember how Ai and PromptRunner create typed objects, fail softly, speak in
    messages, and — on Embabel 1.5 — think, stream, and inspect tool calls.
  recall_route: creating → ifPossible → fromMessages → thinking → stream → inspectors
  metaphor:
    region: The Model-Mouth
    role: PromptRunner And 1.5 Extras
    hero_stage: Speaking Mold
    entry: The Split Workbench morphs into a Mold Mouth, ready to create typed objects
    exit: An Inspector Clipboard that logs tool call activities.
  loci:
  - id: mold-mouth
    seq: 1
    location: Mold Mouth
    concept: Typed Create Object
    visual: In a hexagonal chapel of mirrors, the creature's mouth is a record-shaped steel
      mold that only accepts a matching ingot. Pale bioluminescent strips on blown glass.
      A validation stamp waits. No engravings or lettering on the mold.
    visual_enriched: true
    narration: Welcome to the Mold Mouth, the works-slot of the type-foundry. The pipe-creature
      that wore four planner hats now opens a mouth that is a record-shaped mold. Only a matching
      typed ingot fits. That organ is typed create. Prefer createObject and creating T fromPrompt
      over free text. Ai gives you a PromptRunner. Add an example and optional validation,
      then fromPrompt. Selection later is usually by goal return type. What API creates a
      typed object?
    narration_enriched: true
    overlay: creating(T)
    recall_cue: Record mold → typed create.
    review_question: What API creates a typed object?
    review_answer: creating(T) / createObject
    metaphor_part: works-slot
