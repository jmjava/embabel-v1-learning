  - id: bolted-toolbox
    seq: 4
    location: Bolted Toolbox
    concept: Tools Attach Per Call
    visual: In a cramped coat-closet alcove under red exit-sign gloom, a burnt-sienna leather
      toolbox is bolted only onto the quill wrist, overflowing with wrenches. The foundry
      walls have no toolbox. No lettering.
    visual_enriched: true
    narration: "We are in the Foundry, at the scent-slot of our Pipe-Creature. The creature\
      \ just grew a steel stamp-hand and a glowing quill-hand. Now, it has transformed into\
      \ a toolbox bolted only onto its quill wrist. This toolbox jingles softly with tools\
      \ that tune in to the creature's actions. \n\nThis concept, tools attach per call, means\
      \ that tools are specifically connected to the PromptRunner at the moment they are needed,\
      \ not permanently affixed to the entire agent. For example, @Tool and @LlmTool remain\
      \ invisible until they're called upon. \n\nRemember, before this, we were at the Split\
      \ Workbench, where we mixed code and LLMs. \n\nWhat does the toolbox remind you of?"
    narration_enriched: true
    overlay: withToolObject
    recall_cue: Wrist toolbox → per-call tools.
    review_question: Where do tools attach?
    review_answer: Per call — withToolObject
    metaphor_part: scent-slot
