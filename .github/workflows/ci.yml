name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memoryos-pin:
    name: Offline learning-common tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Pins stay 8822fcb. This job is not Pages and does not run
      # java-demo live-model tests. Offline learning-common checks
      # (CookbookChapterCatalogTest, LessonCoverageTest,
      # CookbookVideoBundleTest) fail the job when they fail.
      # Changing 8822fcb in ingest-manifest.json, README.md, PLAN.md, or
      # the install-script pin makes CookbookVideoBundleTest fail.
      # Leftover #10 also fails if the consumer pin leaves 8822fcb without
      # an explicit leftover under leftovers/memory-os/. Claiming published
      # films pass current memoryos evaluate/gate (12.5s think pause +
      # reverse walk) also fails: the 8822fcb recordings are 2.5s and have
      # no reverse walk. That record is not a film rebuild.
      - name: Run offline learning-common tests
        run: ./mvnw -B -pl learning-common test -Dtest=CookbookChapterCatalogTest,LessonCoverageTest,CookbookVideoBundleTest,OfflineLearningCommonCiTest

  maintainability:
    name: Maintainability ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Hotspot history, diff-scoped detekt and SpotBugs, frozen baselines,
      # the socket ArchUnit test, and PIT on learning-common. This job does
      # not refresh either baseline.
      - name: Run maintainability ratchets
        run: bash scripts/ci-ratchets.sh

  kotlin-guided:
    name: Kotlin guided tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Embabel 1.0
            profile: ""
          - name: Embabel 1.5
            profile: "-Pembabel-15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # kotlin-demo's only tests are offline GuidedTests (FakeOperationContext
      # or pure unit checks). None call a live model, so none are excluded.
      # -Dtest=*GuidedTest selects them, including Cookbook15GuidedTest, and
      # leaves the learning-common pin tests on the job above. The 1.0
      # surefire exclude **/cookbook15/** would otherwise skip that class;
      # selecting it here is safe because it uses FakeOperationContext.
      # -Pembabel-15 is the profile that clears the exclude. Pins stay
      # 8822fcb. This job does not rebuild films.
      - name: Run Kotlin guided tests
        run: ./mvnw -B -pl kotlin-demo -am test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='*GuidedTest' ${{ matrix.profile }}
